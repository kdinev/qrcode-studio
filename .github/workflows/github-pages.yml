name: Deploy GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Serialise deployments; let an in-progress one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # Project sites are served from /<repo>/, so the app is built under that base.
      - name: Build
        run: |
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          echo "Building with base $BASE_PATH"
          npm run build

      # GitHub Pages has no SPA rewrite; 404.html makes deep links resolve to the app.
      - name: Add SPA fallback
        run: cp ./dist/index.html ./dist/404.html

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
